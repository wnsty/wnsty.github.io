<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wnsty's Padding Comparison</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-weight: 600;
            display: inline-block;
        }
        
        .filters {
            margin-bottom: 10px;
        }
        
        label {
            font-size: 13px;
            color: #666;
            margin-right: 4px;
        }
        
        select, input {
            padding: 4px 8px;
            border: 1px solid #ccc;
            font-size: 13px;
            margin-right: 16px;
        }
        
        .item-count, .last-updated {
            font-size: 14px;
            color: #666;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 6px 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        
        th {
            background: #f5f5f5;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        
        th:hover {
            background: #e8e8e8;
        }

        th.expandable {
            cursor: pointer;
        }

        tr.detail-row td {
            padding: 0 20px;
            background: #fafafa;
            font-size: 14px;
            color: #555;
            overflow: hidden;
        }

        tr.detail-row .detail-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out, padding 0.2s ease-out;
        }

        tr.detail-row.open .detail-wrapper {
            max-height: 100px;
            padding: 10px 0;
        }

        .detail-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .detail-content strong {
            color: #333;
        }
        
        th.sorted-asc::after {
            content: ' ▲';
            font-size: 10px;
        }
        
        th.sorted-desc::after {
            content: ' ▼';
            font-size: 10px;
        }
        
        .price {
            font-weight: 500;
        }
        
        .low-price {
            color: #28a745;
        }
        
        .high-price {
            color: #dc3545;
        }
        
        .edit-data {
            margin-top: 10px;
        }
        
        .edit-data summary {
            cursor: pointer;
            font-size: 13px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            margin-top: 8px;
            font-family: monospace;
            font-size: 12px;
        }
        
        button {
            padding: 6px 12px;
            margin-top: 6px;
        }
    </style
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Wnsty's Padding Comparison</h1>
    <span class="last-updated" id="lastUpdated">Last Updated: ...</span>
    <span class="item-count" id="itemCount"></span>
    
    <div class="filters">
        <label>Brand:</label><input type="text" id="brandFilter" placeholder="e.g. ABUniverse">
        <label>Category:</label><select id="categoryFilter"><option value="">All</option></select>
        <label>Waist:</label><select id="waistFilter"><option value="">All</option></select>
        <label>Min Waist:</label><input type="number" id="minWaist" placeholder="28" style="width:60px">
        <label>Max Waist:</label><input type="number" id="maxWaist" placeholder="40" style="width:60px">
        <label>In Stock:</label><input type="checkbox" id="inStock">
        <label>Min Price:</label><input type="number" id="minPrice" placeholder="25" style="width:60px">
        <label>Max Price:</label><input type="number" id="maxPrice" placeholder="50" style="width:60px">
    </div>
    
    <table id="productTable">
        <thead>
            <tr>
                <th data-sort="brand">Brand</th>
                <th data-sort="title">Title</th>
                <th data-sort="capacity">Capacity</th>
                <th data-sort="price">Price</th>
                <th data-sort="units">Units</th>
                <th data-sort="unitPrice">Price/Unit</th>
                <th data-sort="mlPerUnitPrice">ml/Unit Price</th>
                <th data-sort="waist">Waist</th>
                <th data-sort="link">Link</th>
            </tr>
        </thead>
        <tbody id="productBody">
        </tbody>
    </table>

    <script>
        let products = [];
        let currentSort = { column: null, direction: 'asc' };

        function calculatePricePerUnit(product) {
            return product.price / product.quantity;
        }

        function getPriceStats() {
            const perUnitPrices = products.map(p => calculatePricePerUnit(p));
            return {
                min: Math.min(...perUnitPrices),
                max: Math.max(...perUnitPrices)
            };
        }

        function populateFilters() {
            // const categories = [...new Set(products.map(p => p.category))].sort();
            // const waists = [...new Set(products.map(p => p.waist).filter(w => w !== null))].sort((a, b) => a - b);
            
            // const categorySelect = document.getElementById('categoryFilter');
            // categorySelect.innerHTML = '<option value="">All</option>' + 
            //     categories.map(c => `<option value="${c}">${c}</option>`).join('');
            // 
            // const waistSelect = document.getElementById('waistFilter');
            // waistSelect.innerHTML = '<option value="">All</option>' + 
            //     waists.map(w => `<option value="${w}">${w}"</option>`).join('');
        }

        function filterProducts() {
            const brandFilter = document.getElementById('brandFilter').value.toLowerCase();
            // const categoryFilter = document.getElementById('categoryFilter').value;
            // const waistFilter = document.getElementById('waistFilter').value;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
          const minWaist = parseFloat(document.getElementById('minWaist').value) || 0;
          const maxWaist = parseFloat(document.getElementById('maxWaist').value) || Infinity;
            const inStock = document.getElementById('inStock').checked || false;
            
            return products.filter(p => {
                if (brandFilter && !p.brand.toLowerCase().includes(brandFilter)) return false;
                // if (categoryFilter && p.category !== categoryFilter) return false;
                // if (waistFilter && p.waist != waistFilter) return false;
                if (p.waistLow < minWaist || p.waistHigh > maxWaist) return false;
                if (p.price < minPrice || p.price > maxPrice) return false;
                if (inStock && p.inStock == 'No') return false;
                return true;
            });
        }

        function sortProducts(filtered) {
            if (!currentSort.column) return filtered;
            
            return [...filtered].sort((a, b) => {
                let aVal, bVal;
                
                if (currentSort.column === 'pricePerUnit') {
                    aVal = calculatePricePerUnit(a);
                    bVal = calculatePricePerUnit(b);
                } else {
                    aVal = a[currentSort.column];
                    bVal = b[currentSort.column];
                }
                
                if (aVal === null || aVal === undefined) return 1;
                if (bVal === null || bVal === undefined) return -1;
                
                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }
                
                let result = aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
                return currentSort.direction === 'desc' ? -result : result;
            });
        }

        function renderTable() {
            const filtered = filterProducts();
            const sorted = sortProducts(filtered);
            const priceStats = getPriceStats();
            const colCount = document.querySelectorAll('th').length;
            
            const tbody = document.getElementById('productBody');
            tbody.innerHTML = sorted.map((p, i) => {
                const pricePerUnit = calculatePricePerUnit(p);
                const priceClass = pricePerUnit === priceStats.min ? 'low-price' : 
                                   pricePerUnit === priceStats.max ? 'high-price' : '';
                return `<tr class="expandable" onclick="toggleDetail(${i})">
                    <td>${p.brand}</td>
                    <td>${p.title}</td>
                    <td>${p.capacity}</td>
                    <td class="price">$${p.price.toFixed(2)}</td>
                    <td>${p.units}</td>
                    <td>$${p.unitPrice.toFixed(2)}</td>
                    <td>${p.mlPerUnitPrice.toFixed(0)}</td>
                    <td>${p.waistLow} - ${p.waistHigh}</td>
                    <td><a href="${p.url}">Here!</a></td>
                </tr>
                <tr class="detail-row" id="detail-${i}">
                    <td colspan="${colCount}">
                        <div class="detail-wrapper">
                            <div class="detail-content">
                                <div><strong>Id:</strong> ${p.id || '—'}</div>
                                <div><strong>In Stock:</strong> ${p.inStock || '—'}</div>
                                <div><strong>Notes:</strong> ${p.notes.length > 0 ? p.notes : '—'}</div>
                                <!-- <div><strong>Rating:</strong> ${p.rating ? '★ ' + p.rating + '/5' : '—'}</div> -->
                                <!-- <div><strong>Color:</strong> ${p.color || '—'}</div> -->
                                <!-- <div><strong>SKU:</strong> ${p.sku || '—'}</div> -->
                            </div>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            //     <td>${p.category}</td>
            //     <td class="price">$${p.price.toFixed(2)}</td>
            //     <td>${p.quantity}</td>
            //     <td class="price ${priceClass}">$${pricePerUnit.toFixed(2)}</td>
            //     <td>${p.waist ? p.waist + '"' : '—'}</td>
            //     <td>${p.length ? p.length + '"' : '—'}</td>
            //     <td>${p.material}</td>
            //     <td>${p.rating ? '★ ' + p.rating : '—'}</td>
            // </tr>`;
            
            document.getElementById('itemCount').textContent = `Showing ${sorted.length} of ${products.length} items`;
            
            // Update sort indicators
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (th.dataset.sort === currentSort.column) {
                    th.classList.add(`sorted-${currentSort.direction}`);
                }
            });
        }

        function handleSort(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            renderTable();
        }

        function toggleDetail(index) {
            const detailRow = document.getElementById(`detail-${index}`);
            detailRow.classList.toggle('open');
        }

        function loadDataFromEditor() {
            try {
                products = JSON.parse(document.getElementById('dataEditor').value);
                populateFilters();
                renderTable();
            } catch (e) {
                alert('Invalid JSON: ' + e.message);
            }
        }

        // Initialize
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => handleSort(th.dataset.sort));
        });

        ['brandFilter', 'categoryFilter', 'waistFilter', 'maxPrice', 'minPrice', 'inStock', 'minWaist', 'maxWaist'].forEach(id => {
            document.getElementById(id).addEventListener('input', renderTable);
        });

        const setLastUpdated = (lastUpdated) => {
          const e = document.getElementById('lastUpdated').innerText = `Last Updated: ${lastUpdated}`;
        }

        const getData = async () => {
          const url = `https://api.github.com/repos/wnsty/wnsty.github.io/contents/data`;
          const response = await fetch(url);
          const files = await response.json();
          const jsonFiles = files
            .filter(file => file.name.endsWith('.json'))
            .sort((a, b) => new Date(b.name.split(".")[0]) - new Date(a.name.split(".")[0]));

          if (jsonFiles.length === 0) {
            console.error("no JSON files found");
            return [];
          }

          setLastUpdated(jsonFiles[0].name.split('.')[0]);

          const latestUrl = jsonFiles[0].download_url;
          const latestResponse = await fetch(latestUrl);
          return await latestResponse.json();
        }

        async function init() {
          products = await getData();
          populateFilters();
          renderTable();
        }

        init();
    </script>
</body>
</html>
